<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 6 - Part 2: jQuery Effects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Assignment 6 (jQuery)</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Part 1: Basic</a>
                <a class="nav-link active" href="part2.html">Part 2: Effects</a>
                <a class="nav-link" href="part3.html">Part 3: DOM</a>
                <a class="nav-link" href="part4.html">Part 4: Animations</a>
                <a class="nav-link" href="part5.html">Part 5: Mini Project</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center g-4">
            <div class="col-md-8">
                
                <div class="card shadow-sm p-4 mb-4">
                    <h4 class="card-title border-bottom pb-2 mb-3">Task 2: Visibility Methods</h4>
                    <p id="visibility-target" class="alert alert-primary">
                        Pleas give me A+
                    </p>
                    <div class="d-flex gap-2">
                        <button id="btn-hide" class="btn btn-danger">Hide</button>
                        <button id="btn-show" class="btn btn-success">Show</button>
                        <button id="btn-toggle-vis" class="btn btn-warning">Toggle</button>
                    </div>
                </div>

                <div class="card shadow-sm p-4 mb-4">
                    <h4 class="card-title border-bottom pb-2 mb-3">Task 3: Fade Methods</h4>
                    <div class="text-center mb-3" style="min-height: 200px;">
                        <img id="fade-target" src="https://picsum.photos/400/200" alt="Sample Image" class="img-fluid rounded shadow-sm">
                    </div>
                    <div class="d-flex justify-content-center gap-2">
                        <button id="btn-fade-out" class="btn btn-danger">Fade Out</button>
                        <button id="btn-fade-in" class="btn btn-success">Fade In</button>
                        <button id="btn-fade-toggle" class="btn btn-warning">Fade Toggle</button>
                    </div>
                </div>

                <div class="card shadow-sm p-4">
                    <h4 class="card-title border-bottom pb-2 mb-3">Task 4: Slide Methods</h4>
                    
                    <div class="mb-3">
                        <button id="btn-slide-toggle" class="btn btn-primary w-100 mb-2">Toggle Panel</button>
                        <div class="d-flex gap-2 mb-2">
                            <button id="btn-slide-up" class="btn btn-outline-danger w-50">Slide Up</button>
                            <button id="btn-slide-down" class="btn btn-outline-success w-50">Slide Down</button>
                        </div>
                    </div>

                    <div id="slide-target" class="p-4 bg-white border rounded shadow-sm">
                        <h5 class="text-primary">Collapsible Panel Content</h5>
                        <p class="mb-0">Panel content</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function() {
            $("#btn-hide").click(function() {
                $("#visibility-target").hide();
            });

            $("#btn-show").click(function() {
                $("#visibility-target").show();
            });

            $("#btn-toggle-vis").click(function() {
                $("#visibility-target").toggle();
            });

            $("#btn-fade-out").click(function() {
                $("#fade-target").fadeOut(600);
            });

            $("#btn-fade-in").click(function() {
                $("#fade-target").fadeIn(600);
            });

            $("#btn-fade-toggle").click(function() {
                $("#fade-target").fadeToggle(600);
            });

            $("#btn-slide-up").click(function() {
                $("#slide-target").slideUp();
            });

            $("#btn-slide-down").click(function() {
                $("#slide-target").slideDown();
            });

            $("#btn-slide-toggle").click(function() {
                $("#slide-target").slideToggle();
            });
        });
    </script>
</body>
</html>
