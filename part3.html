<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 6 - Part 3: DOM Manipulation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Assignment 6 (jQuery)</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Part 1: Basic</a>
                <a class="nav-link" href="part2.html">Part 2: Effects</a>
                <a class="nav-link active" href="part3.html">Part 3: DOM</a>
                <a class="nav-link" href="part4.html">Part 4: Animations</a>
                <a class="nav-link" href="part5.html">Part 5: Mini Project</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center g-4">
            <div class="col-md-8">

                <div class="card shadow-sm p-4 mb-4">
                    <h4 class="card-title border-bottom pb-2 mb-3">Task 5: Add & Remove Elements</h4>
                    <ul id="dynamic-list" class="list-group mb-3">
                        <li class="list-group-item">Initial Item 1</li>
                        <li class="list-group-item">Initial Item 2</li>
                    </ul>
                    <div class="d-flex gap-2">
                        <button id="btn-append" class="btn btn-primary">Append Item (End)</button>
                        <button id="btn-prepend" class="btn btn-secondary">Prepend Item (Start)</button>
                        <button id="btn-remove" class="btn btn-danger">Remove Last Item</button>
                    </div>
                </div>

                <div class="card shadow-sm p-4 mb-4">
                    <h4 class="card-title border-bottom pb-2 mb-3">Task 6: Modifying Attributes</h4>
                    
                    <div class="text-center mb-3">
                        <img id="dynamic-img" src="https://picsum.photos/id/10/300/150" alt="Random Image" class="img-fluid rounded mb-2 shadow-sm">
                        <div>
                            <button id="btn-change-img" class="btn btn-warning mb-3">Change Image Source</button>
                        </div>
                    </div>

                    <div class="text-center border-top pt-3">
                        <p>Link target: <a id="dynamic-link" href="https://google.com" target="_blank" class="fw-bold">Google.com</a></p>
                        <button id="btn-change-link" class="btn btn-info">Change Link Href</button>
                    </div>
                </div>

                <div class="card shadow-sm p-4">
                    <h4 class="card-title border-bottom pb-2 mb-3">Task 7: Form Interaction</h4>
                    <form id="live-form">
                        <div class="mb-3">
                            <label for="input-name" class="form-label font-weight-bold">Name:</label>
                            <input type="text" id="input-name" class="form-control" placeholder="Type your name...">
                        </div>
                        <div class="mb-3">
                            <label for="input-email" class="form-label font-weight-bold">Email:</label>
                            <input type="email" id="input-email" class="form-control" placeholder="Type your email...">
                        </div>
                    </form>

                    <div class="p-3 bg-white border rounded">
                        <h6 class="text-muted">Live Preview:</h6>
                        <p class="mb-1"><strong>Name:</strong> <span id="preview-name" class="text-primary">---</span></p>
                        <p class="mb-0"><strong>Email:</strong> <span id="preview-email" class="text-primary">---</span></p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function() {
            let itemCount = 2;

            $("#btn-append").click(function() {
                itemCount++;
                $("#dynamic-list").append('<li class="list-group-item">Appended Item ' + itemCount + '</li>');
            });

            $("#btn-prepend").click(function() {
                itemCount++;
                $("#dynamic-list").prepend('<li class="list-group-item">Prepended Item ' + itemCount + '</li>');
            });

            $("#btn-remove").click(function() {
                $("#dynamic-list li:last-child").remove();
            });

            $("#btn-change-img").click(function() {
                $("#dynamic-img").attr("src", "https://picsum.photos/id/20/300/150");
            });

            $("#btn-change-link").click(function() {
                $("#dynamic-link")
                    .attr("href", "https://github.com")
                    .text("GitHub.com");
            });

            $("#input-name").on("input", function() {
                let nameVal = $(this).val();
                $("#preview-name").text(nameVal !== "" ? nameVal : "---");
            });

            $("#input-email").on("input", function() {
                let emailVal = $(this).val();
                $("#preview-email").text(emailVal !== "" ? emailVal : "---");
            });
        });
    </script>
</body>
</html>
